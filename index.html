<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <link
            href="/fonts/general-sans/GeneralSans-Variable.woff2"
            rel="preload"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            href="/fonts/pixelify-sans/PixelifySans-Regular-latin.woff2"
            rel="preload"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <!-- Primary Meta Tags -->
        <title>Diky Maulidan Ridho A - Fullstack Web Developer</title>
        <meta
            content="Fullstack web developer in Bali, Indonesia. I build fast, accessible web apps end to end with Next.js, Svelte, Laravel and Go."
            name="description"
        />
        <meta
            content="web developer, fullstack developer, Next.js developer, Svelte developer, Laravel developer, Go developer, React developer, Angular developer, frontend developer, backend developer, Bali developer, Indonesia developer, TypeScript, Tailwind CSS, PostgreSQL, MySQL, Diky Maulidan Ridho A"
            name="keywords"
        />
        <meta content="Diky Maulidan Ridho A" name="author" />
        <meta content="index, follow" name="robots" />
        <meta content="English" name="language" />
        <meta content="7 days" name="revisit-after" />

        <!-- Open Graph / Facebook -->
        <meta content="website" property="og:type" />
        <meta content="https://dikym.me/" property="og:url" />
        <meta
            content="Diky Maulidan Ridho A - Fullstack Web Developer"
            property="og:title"
        />
        <meta
            content="Fullstack web developer in Bali, Indonesia. I build fast, accessible web apps end to end with Next.js, Svelte, Laravel and Go."
            property="og:description"
        />
        <meta content="https://dikym.me/og-image.png" property="og:image" />
        <meta content="1200" property="og:image:width" />
        <meta content="630" property="og:image:height" />
        <meta
            content="Diky Maulidan Ridho A - Fullstack Web Developer"
            property="og:image:alt"
        />
        <meta content="en_US" property="og:locale" />
        <meta
            content="Diky Maulidan Ridho A Portfolio"
            property="og:site_name"
        />

        <!-- Twitter: X reads these by name, not property -->
        <meta content="summary_large_image" name="twitter:card" />
        <meta
            content="Diky Maulidan Ridho A - Fullstack Web Developer"
            name="twitter:title"
        />
        <meta
            content="Fullstack web developer in Bali, Indonesia. I build fast, accessible web apps end to end with Next.js, Svelte, Laravel and Go."
            name="twitter:description"
        />
        <meta content="https://dikym.me/og-image.png" name="twitter:image" />
        <meta
            content="Diky Maulidan Ridho A - Fullstack Web Developer"
            name="twitter:image:alt"
        />

        <!-- Additional SEO -->
        <link href="https://dikym.me/" rel="canonical" />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Diky Maulidan Ridho A",
                "url": "https://dikym.me/",
                "image": "https://dikym.me/og-image.png",
                "jobTitle": "Fullstack Web Developer",
                "address": {
                    "@type": "PostalAddress",
                    "addressRegion": "Bali",
                    "addressCountry": "ID"
                },
                "sameAs": [
                    "https://github.com/dikym",
                    "https://linkedin.com/in/dikym"
                ]
            }
        </script>
        <meta content="#FFFCF0" name="theme-color" />
        <script>
            try {
                if (localStorage.getItem("theme") === "dark")
                    document.documentElement.classList.add("dark");
            } catch {}
        </script>

        <link href="/src/style.css" rel="stylesheet" />
        <link href="/icons/alien.svg" rel="icon" type="image/svg+xml" />
        <link href="/favicon.ico" rel="icon" sizes="32x32" />
        <link
            href="/favicon-32x32.png"
            rel="icon"
            type="image/png"
            sizes="32x32"
        />
        <link
            href="/favicon-16x16.png"
            rel="icon"
            type="image/png"
            sizes="16x16"
        />
        <link
            href="/apple-touch-icon.png"
            rel="apple-touch-icon"
            sizes="180x180"
        />
        <link href="/site.webmanifest" rel="manifest" />
    </head>
    <body>
        <!-- Static h1 for crawlers that skip JS; React replaces it on mount -->
        <div id="root">
            <h1 class="sr-only">Fullstack web developer based in Bali.</h1>
        </div>
        <script src="/src/main.tsx" type="module"></script>
    </body>
</html>
